<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Library Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h2 {
      color: #2c3e50;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

  </style>

</head>

<body>

<div class="container">

  <h2>📷 Library Barcode Scanner</h2>

  <p>Point the rear camera at the barcode.</p>

  <div id="reader"></div>

  <div id="status">
    Starting camera...
  </div>

</div>

<script>

var html5QrcodeScanner =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 280,
        height: 120
      },

      rememberLastUsedCamera: true,

      showTorchButtonIfSupported: true
    },

    false
  );


function onScanSuccess(
  decodedText,
  decodedResult
) {

  document.getElementById(
    "status"
  ).innerText =
    "Scanned: " + decodedText;


  if (window.opener) {

    window.opener.postMessage(

      {
        type: "LIBRARY_BARCODE",
        barcode: decodedText
      },

      "*"

    );

  }


  html5QrcodeScanner
    .clear()
    .then(function() {

      window.close();

    });

}


function onScanFailure(error) {

  // Keep scanning.

}


html5QrcodeScanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>

</html>
