<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Library Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    h2 {
      color: #2c3e50;
      margin-top: 5px;
    }

    .instructions {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f0f0f0;
      font-weight: bold;
      word-break: break-word;
    }

    #zoomControl {
      margin-top: 15px;
      padding: 10px;
      background: #f7f7f7;
      border-radius: 8px;
    }

    #zoomSlider {
      width: 80%;
    }

    #zoomLabel {
      font-size: 13px;
      color: #555;
      margin-top: 5px;
    }

  </style>

</head>


<body>

<div class="container">

  <h2>📷 Library Barcode Scanner</h2>

  <p class="instructions">
    Hold the barcode inside the scanning area.<br>
    Keep the barcode reasonably close to the camera and steady.
  </p>

  <div id="reader"></div>

  <div id="zoomControl" style="display:none;">

    <input
      type="range"
      id="zoomSlider"
      min="1"
      max="1"
      step="0.1"
      value="1"
    >

    <div id="zoomLabel">
      Camera zoom: 1×
    </div>

  </div>

  <div id="status">
    Starting high-resolution camera...
  </div>

</div>


<script>


/* =========================================
   GLOBAL VARIABLES
   ========================================= */

var scanner = null;

var scanning = false;

var lastScanned = "";

var lastScanTime = 0;

var currentTrack = null;


/* =========================================
   START SCANNER
   ========================================= */

function startScanner() {

  scanner =
    new Html5Qrcode("reader");


  /*
   * Large scanning region.
   *
   * Library barcodes are normally
   * horizontal, so the region is
   * deliberately wider than tall.
   */

  var config = {

    fps: 25,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      var width =
        Math.min(
          viewfinderWidth * 0.94,
          700
        );

      var height =
        Math.min(
          viewfinderHeight * 0.50,
          300
        );

      return {

        width: width,

        height: height

      };

    },


    aspectRatio:
      1.7777778,


    /*
     * Only barcode formats relevant
     * to the library system.
     */

    formatsToSupport: [

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.CODE_93,

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E

    ],


    /*
     * Use native BarcodeDetector
     * when the browser supports it.
     */

    experimentalFeatures: {

      useBarCodeDetectorIfSupported: true

    }

  };


  /*
   * Request the rear camera and
   * high-resolution video.
   */

  var cameraConfig = {

    facingMode: {

      exact: "environment"

    },

    width: {

      ideal: 1920

    },

    height: {

      ideal: 1080

    },

    frameRate: {

      ideal: 30,

      max: 30

    }

  };


  scanner.start(

    cameraConfig,

    config,

    onScanSuccess,

    onScanFailure

  )

  .then(function() {

    scanning = true;


    document.getElementById(
      "status"
    ).innerText =
      "High-resolution camera ready.";


    setupCameraControls();

  })

  .catch(function(error) {

    console.error(
      "High-resolution camera failed:",
      error
    );


    startFallbackCamera();

  });

}


/* =========================================
   FALLBACK CAMERA
   ========================================= */

function startFallbackCamera() {

  Html5Qrcode
    .getCameras()

    .then(function(devices) {

      if (
        !devices ||
        devices.length === 0
      ) {

        throw new Error(
          "No camera was found."
        );

      }


      /*
       * Prefer the camera whose label
       * indicates a rear/environment camera.
       */

      var cameraId =
        devices[devices.length - 1].id;


      for (
        var i = 0;
        i < devices.length;
        i++
      ) {

        var label =
          String(
            devices[i].label || ""
          ).toLowerCase();


        if (
          label.indexOf("back") !== -1 ||
          label.indexOf("rear") !== -1 ||
          label.indexOf("environment") !== -1
        ) {

          cameraId =
            devices[i].id;

          break;

        }

      }


      scanner.start(

        cameraId,

        {

          fps: 25,


          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            return {

              width:
                Math.min(
                  viewfinderWidth * 0.94,
                  700
                ),

              height:
                Math.min(
                  viewfinderHeight * 0.50,
                  300
                )

            };

          },


          aspectRatio:
            1.7777778,


          formatsToSupport: [

            Html5QrcodeSupportedFormats.CODE_39,

            Html5QrcodeSupportedFormats.CODE_93,

            Html5QrcodeSupportedFormats.CODE_128,

            Html5QrcodeSupportedFormats.EAN_13,

            Html5QrcodeSupportedFormats.EAN_8,

            Html5QrcodeSupportedFormats.UPC_A,

            Html5QrcodeSupportedFormats.UPC_E

          ],


          experimentalFeatures: {

            useBarCodeDetectorIfSupported:
              true

          }

        },

        onScanSuccess,

        onScanFailure

      )

      .then(function() {

        scanning = true;


        document.getElementById(
          "status"
        ).innerText =
          "High-resolution camera ready.";


        setupCameraControls();

      })

      .catch(function(error) {

        document.getElementById(
          "status"
        ).innerText =
          "Unable to start camera.";

        console.error(error);

      });

    })

    .catch(function(error) {

      document.getElementById(
        "status"
      ).innerText =
        "No usable camera found.";

      console.error(error);

    });

}


/* =========================================
   CAMERA CONTROLS
   ========================================= */

function setupCameraControls() {

  try {

    var video =
      document.querySelector(
        "#reader video"
      );


    if (!video) {

      return;

    }


    currentTrack =
      video.srcObject
        ? video.srcObject.getVideoTracks()[0]
        : null;


    if (!currentTrack) {

      return;

    }


    var capabilities =
      currentTrack.getCapabilities();


    /*
     * Zoom support.
     */

    if (
      capabilities &&
      capabilities.zoom
    ) {

      var slider =
        document.getElementById(
          "zoomSlider"
        );

      var control =
        document.getElementById(
          "zoomControl"
        );

      var label =
        document.getElementById(
          "zoomLabel"
        );


      var minZoom =
        capabilities.zoom.min;


      var maxZoom =
        capabilities.zoom.max;


      var stepZoom =
        capabilities.zoom.step ||
        0.1;


      slider.min =
        minZoom;

      slider.max =
        maxZoom;

      slider.step =
        stepZoom;

      slider.value =
        minZoom;


      control.style.display =
        "block";


      label.innerText =
        "Camera zoom: " +
        Number(minZoom).toFixed(1) +
        "×";


      slider.oninput =
        function() {

          var zoom =
            Number(
              this.value
            );


          currentTrack
            .applyConstraints({

              advanced: [

                {
                  zoom: zoom
                }

              ]

            })

            .then(function() {

              label.innerText =
                "Camera zoom: " +
                zoom.toFixed(1) +
                "×";

            })

            .catch(function(error) {

              console.error(
                "Zoom failed:",
                error
              );

            });

        };

    }


    /*
     * Autofocus / focus capability.
     */

    if (
      capabilities &&
      capabilities.focusMode
    ) {

      try {

        currentTrack
          .applyConstraints({

            advanced: [

              {
                focusMode: "continuous"
              }

            ]

          })

          .catch(function() {});

      }

      catch (error) {}

    }

  }

  catch (error) {

    console.error(
      "Camera controls unavailable:",
      error
    );

  }

}


/* =========================================
   SCAN SUCCESS
   ========================================= */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (!decodedText) {

    return;

  }


  var now =
    Date.now();


  /*
   * Prevent the same barcode from
   * being accepted repeatedly.
   */

  if (
    decodedText === lastScanned &&
    now - lastScanTime < 3000
  ) {

    return;

  }


  lastScanned =
    decodedText;

  lastScanTime =
    now;


  document.getElementById(
    "status"
  ).innerText =
    "✓ Scanned: " +
    decodedText;


  /*
   * Send barcode back to the
   * Library Action Desk.
   */

  if (window.opener) {

    window.opener.postMessage(

      {

        type:
          "LIBRARY_BARCODE",

        barcode:
          decodedText

      },

      "*"

    );

  }


  /*
   * Stop the camera.
   */

  if (
    scanner &&
    scanning
  ) {

    scanner
      .stop()

      .then(function() {

        scanning = false;

        return scanner.clear();

      })

      .then(function() {

        window.close();

      })

      .catch(function(error) {

        console.error(error);

        window.close();

      });

  }

}


/* =========================================
   SCAN FAILURE
   ========================================= */

function onScanFailure(error) {

  /*
   * Deliberately empty.
   *
   * The scanner continuously tries
   * to decode the barcode.
   */

}


/* =========================================
   START WHEN PAGE LOADS
   ========================================= */

window.addEventListener(

  "load",

  function() {

    startScanner();

  }

);

</script>

</body>

</html>
