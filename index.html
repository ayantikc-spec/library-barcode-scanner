<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Library Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    h2 {
      color: #2c3e50;
      margin-top: 5px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f0f0f0;
      font-weight: bold;
    }

    .instructions {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

  </style>

</head>

<body>

<div class="container">

  <h2>📷 Library Barcode Scanner</h2>

  <p class="instructions">
    Hold the barcode steady inside the scanning area.<br>
    Move the camera slightly closer or farther if necessary.
  </p>

  <div id="reader"></div>

  <div id="status">
    Starting high-resolution camera...
  </div>

</div>


<script>

var scanner = null;

var scanning = false;

var lastScanned = "";

var lastScanTime = 0;


/* =========================================
   START SCANNER
   ========================================= */

function startScanner() {

  scanner = new Html5Qrcode("reader");


  var config = {

    fps: 20,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      /*
       * Large horizontal scanning region
       * suitable for library barcodes.
       */

      var width =
        Math.min(
          viewfinderWidth * 0.90,
          500
        );

      var height =
        Math.min(
          viewfinderHeight * 0.45,
          220
        );

      return {
        width: width,
        height: height
      };

    },


    aspectRatio: 1.7777778,


    formatsToSupport: [

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.CODE_93,

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E

    ],


    experimentalFeatures: {

      useBarCodeDetectorIfSupported: true

    }

  };


  /*
   * Prefer the rear camera.
   */

  var cameraConfig = {

    facingMode: {
      exact: "environment"
    }

  };


  scanner.start(

    cameraConfig,

    config,

    onScanSuccess,

    onScanFailure

  )

  .then(function() {

    scanning = true;

    document.getElementById(
      "status"
    ).innerText =
      "Camera ready. Point it at the barcode.";

  })

  .catch(function(error) {

    console.error(error);


    /*
     * Some browsers reject exact
     * environment camera selection.
     *
     * Fall back to any available camera.
     */

    startFallbackCamera();

  });

}


/* =========================================
   FALLBACK CAMERA
   ========================================= */

function startFallbackCamera() {

  Html5Qrcode
    .getCameras()

    .then(function(devices) {

      if (
        !devices ||
        devices.length === 0
      ) {

        throw new Error(
          "No camera was found."
        );

      }


      var cameraId =
        devices[devices.length - 1].id;


      scanner.start(

        cameraId,

        {

          fps: 20,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            return {

              width:
                Math.min(
                  viewfinderWidth * 0.90,
                  500
                ),

              height:
                Math.min(
                  viewfinderHeight * 0.45,
                  220
                )

            };

          },

          formatsToSupport: [

            Html5QrcodeSupportedFormats.CODE_39,

            Html5QrcodeSupportedFormats.CODE_93,

            Html5QrcodeSupportedFormats.CODE_128,

            Html5QrcodeSupportedFormats.EAN_13,

            Html5QrcodeSupportedFormats.EAN_8,

            Html5QrcodeSupportedFormats.UPC_A,

            Html5QrcodeSupportedFormats.UPC_E

          ],

          experimentalFeatures: {

            useBarCodeDetectorIfSupported: true

          }

        },

        onScanSuccess,

        onScanFailure

      )

      .then(function() {

        scanning = true;

        document.getElementById(
          "status"
        ).innerText =
          "Camera ready. Point it at the barcode.";

      })

      .catch(function(error) {

        document.getElementById(
          "status"
        ).innerText =
          "Unable to start camera.";

        console.error(error);

      });

    })

    .catch(function(error) {

      document.getElementById(
        "status"
      ).innerText =
        "No usable camera found.";

      console.error(error);

    });

}


/* =========================================
   SUCCESS
   ========================================= */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (!decodedText) {
    return;
  }


  var now =
    Date.now();


  /*
   * Prevent duplicate scans.
   */

  if (
    decodedText === lastScanned &&
    now - lastScanTime < 3000
  ) {

    return;

  }


  lastScanned = decodedText;

  lastScanTime = now;


  document.getElementById(
    "status"
  ).innerText =
    "✓ Scanned: " + decodedText;


  /*
   * Send barcode back to
   * the parent Library Action Desk.
   */

  if (window.opener) {

    window.opener.postMessage(

      {

        type: "LIBRARY_BARCODE",

        barcode: decodedText

      },

      "*"

    );

  }


  /*
   * Stop camera.
   */

  if (scanner && scanning) {

    scanner
      .stop()

      .then(function() {

        scanning = false;

        return scanner.clear();

      })

      .then(function() {

        /*
         * Close scanner window.
         */

        window.close();

      })

      .catch(function(error) {

        console.error(error);

        window.close();

      });

  }

}


/* =========================================
   SCAN FAILURE
   ========================================= */

function onScanFailure(error) {

  /*
   * Do nothing.
   *
   * Scanner continuously attempts
   * to decode the barcode.
   */

}


/* =========================================
   START
   ========================================= */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);

</script>

</body>

</html>
