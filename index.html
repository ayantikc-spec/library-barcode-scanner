<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Library Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 14px;
    }

    h2 {
      color: #2c3e50;
      margin-top: 5px;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 10px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      min-height: 25px;
    }

    #cameraSelect {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      margin-top: 10px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #2c3e50;
      color: white;
      font-size: 15px;
    }

    .hidden {
      display: none;
    }

  </style>

</head>

<body>

<div class="container">

  <h2>📷 Library Barcode Scanner</h2>

  <p>Point the rear camera at the barcode.</p>

  <select id="cameraSelect" class="hidden"></select>

  <div id="reader"></div>

  <div id="status">
    Requesting camera access...
  </div>

</div>


<script>

var scanner = null;

var isScanning = false;

var hasScanned = false;


/* =========================================
   SUPPORTED BARCODE FORMATS
   ========================================= */

var barcodeFormats = [

  Html5QrcodeSupportedFormats.CODE_39,

  Html5QrcodeSupportedFormats.CODE_93,

  Html5QrcodeSupportedFormats.CODE_128,

  Html5QrcodeSupportedFormats.EAN_13,

  Html5QrcodeSupportedFormats.EAN_8,

  Html5QrcodeSupportedFormats.UPC_A,

  Html5QrcodeSupportedFormats.UPC_E

];


/* =========================================
   STATUS
   ========================================= */

function setStatus(message) {

  document.getElementById(
    "status"
  ).innerText = message;

}


/* =========================================
   FIND REAR CAMERA
   ========================================= */

function findRearCamera(cameras) {

  if (!cameras || cameras.length === 0) {

    return null;

  }


  var rearKeywords = [

    "back",
    "rear",
    "environment",
    "facing back",
    "camera 0"

  ];


  for (
    var i = 0;
    i < cameras.length;
    i++
  ) {

    var label =
      String(
        cameras[i].label || ""
      ).toLowerCase();


    for (
      var j = 0;
      j < rearKeywords.length;
      j++
    ) {

      if (
        label.indexOf(
          rearKeywords[j]
        ) !== -1
      ) {

        return cameras[i];

      }

    }

  }


  /*
   * On many mobile phones the last
   * camera returned is the rear camera.
   */

  if (cameras.length > 1) {

    return cameras[
      cameras.length - 1
    ];

  }


  return cameras[0];

}


/* =========================================
   SHOW CAMERA LIST
   ========================================= */

function populateCameraList(cameras) {

  var select =
    document.getElementById(
      "cameraSelect"
    );


  select.innerHTML = "";


  for (
    var i = 0;
    i < cameras.length;
    i++
  ) {

    var option =
      document.createElement(
        "option"
      );


    option.value =
      cameras[i].id;


    option.text =
      cameras[i].label ||
      ("Camera " + (i + 1));


    select.appendChild(
      option
    );

  }


  if (cameras.length > 1) {

    select.classList.remove(
      "hidden"
    );

  }

}


/* =========================================
   START CAMERA
   ========================================= */

function startScanner(cameraId) {

  if (scanner) {

    try {

      scanner.stop();

    }

    catch (error) {

    }

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  var config = {

    fps: 20,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      /*
       * Large horizontal scanning area.
       * Particularly useful for library
       * Code 39 / Code 128 barcodes.
       */

      var width =
        Math.min(
          viewfinderWidth * 0.92,
          500
        );


      var height =
        Math.min(
          viewfinderHeight * 0.55,
          220
        );


      return {

        width: width,
        height: height

      };

    },

    aspectRatio: 1.7777778,

    formatsToSupport:
      barcodeFormats,

    experimentalFeatures: {

      useBarCodeDetectorIfSupported: true

    }

  };


  setStatus(
    "Starting rear camera..."
  );


  scanner.start(

    cameraId,

    config,

    onScanSuccess,

    onScanFailure

  )

  .then(function() {

    isScanning = true;

    setStatus(
      "Scanner ready. Align the barcode inside the box."
    );

  })

  .catch(function(error) {

    isScanning = false;

    console.error(
      "Camera start error:",
      error
    );


    setStatus(
      "Camera could not start. Trying another camera..."
    );


    /*
     * Try environment-facing camera
     * directly as a fallback.
     */

    startEnvironmentCamera();

  });

}


/* =========================================
   ENVIRONMENT CAMERA FALLBACK
   ========================================= */

function startEnvironmentCamera() {

  if (scanner) {

    try {

      scanner.clear();

    }

    catch (error) {

    }

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  var config = {

    fps: 20,

    qrbox: {

      width: 350,

      height: 200

    },

    aspectRatio: 1.7777778,

    formatsToSupport:
      barcodeFormats,

    experimentalFeatures: {

      useBarCodeDetectorIfSupported: true

    }

  };


  scanner.start(

    {
      facingMode:
        {
          exact:
            "environment"
        }
    },

    config,

    onScanSuccess,

    onScanFailure

  )

  .then(function() {

    isScanning = true;

    setStatus(
      "Rear camera ready. Scan the barcode."
    );

  })

  .catch(function(error) {

    console.error(
      "Environment camera error:",
      error
    );


    setStatus(
      "No usable camera found. Please allow camera access and reload the page."
    );

  });

}


/* =========================================
   SUCCESS
   ========================================= */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (hasScanned) {

    return;

  }


  hasScanned = true;


  var barcode =
    String(
      decodedText || ""
    ).trim();


  setStatus(
    "Scanned: " + barcode
  );


  /*
   * Send barcode back to the
   * main Library Action Desk.
   */

  if (window.opener) {

    window.opener.postMessage(

      {

        type:
          "LIBRARY_BARCODE",

        barcode:
          barcode

      },

      "*"

    );

  }


  /*
   * Stop scanner before closing.
   */

  if (scanner && isScanning) {

    scanner.stop()

      .then(function() {

        return scanner.clear();

      })

      .then(function() {

        setTimeout(
          function() {

            window.close();

          },
          200
        );

      })

      .catch(function() {

        window.close();

      });

  }

  else {

    window.close();

  }

}


/* =========================================
   SCAN FAILURE
   ========================================= */

function onScanFailure(error) {

  /*
   * Deliberately empty.
   *
   * The scanner calls this continuously
   * while searching for a barcode.
   */

}


/* =========================================
   CAMERA INITIALIZATION
   ========================================= */

function initializeCamera() {

  setStatus(
    "Requesting camera permission..."
  );


  Html5Qrcode.getCameras()

    .then(function(cameras) {

      console.log(
        "Available cameras:",
        cameras
      );


      if (
        !cameras ||
        cameras.length === 0
      ) {

        setStatus(
          "No camera was detected on this device."
        );

        return;

      }


      populateCameraList(
        cameras
      );


      var rearCamera =
        findRearCamera(
          cameras
        );


      if (!rearCamera) {

        setStatus(
          "Could not identify a usable camera."
        );

        return;

      }


      /*
       * Select rear camera in dropdown.
       */

      document.getElementById(
        "cameraSelect"
      ).value =
        rearCamera.id;


      startScanner(
        rearCamera.id
      );

    })

    .catch(function(error) {

      console.error(
        "Camera enumeration error:",
        error
      );


      /*
       * If camera enumeration fails,
       * try the environment camera directly.
       */

      startEnvironmentCamera();

    });

}


/* =========================================
   CAMERA SWITCH
   ========================================= */

document.getElementById(
  "cameraSelect"
).addEventListener(
  "change",
  function() {

    var cameraId =
      this.value;


    if (!cameraId) {

      return;

    }


    hasScanned = false;


    startScanner(
      cameraId
    );

  }
);


/* =========================================
   START
   ========================================= */

initializeCamera();

</script>

</body>

</html>
